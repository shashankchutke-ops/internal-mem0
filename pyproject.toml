[project]
name = "mem0-self-hosted-mcp"
version = "0.1.0"
description = "Local MCP bridge for the self-hosted Mem0 REST API"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
mem0-mcp = "mem0_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem0_mcp"]
